version: '3.8'

services:
  meusite:
    image: nginx:latest
    container_name: meu-site
    ports:
      - "8080:80"
    volumes:
      - ./website:/usr/share/nginx/html/
    depends_on:
      - banco_dados


# Alula 19
  banco_dados:
    image: mysql:5.7
    container_name: mysql-banco
    environment:
      - MYSQL_ROOT_PASSWORD: ${DB_SENHA}
      - MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - dados-mysql:/var/lib/mysql

  minhabase:
    image: adminer:latest
    container_name: minhabase
    ports:
      - "${PORTA_ADMINER}:8080"
    depends_on:
      - banco_dados

volumes:
  dados-mysql:
